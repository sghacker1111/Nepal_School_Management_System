name: Validate and deploy Nepal ERP to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to InfinityFree after MySQL import and private configuration are ready'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Never interrupt an FTP transfer or allow concurrent writes to the same site.
concurrency:
  group: school-ftp-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application and deployment boundaries
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    - name: Set up build-time Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Verify deployment safeguards
      run: python3 tests/deployment_test.py
    - name: Build and verify frontend
      run: |
        npm ci --no-fund
        npm run build
        npm run test:ui

  web-deploy:
    name: Deploy to InfinityFree over TLS
    needs: validate
    if: github.ref == 'refs/heads/main' && (vars.FTP_DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment: infinityfree-production
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history so git diff works for FTP deploy

    - name: Set up build-time Node (not required by the PHP host)
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Build local frontend assets
      run: |
        npm ci --no-fund
        npm run build
        npm run test:ui
    
    - name: Validate hosting configuration
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
      shell: bash
      run: |
        set -euo pipefail
        for setting in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
          if [[ -z "${!setting}" ]]; then
            echo "::error::Set $setting in this repository's Actions settings before deployment."
            exit 1
          fi
        done
        if [[ "$FTP_SERVER_DIR" != 'school.my-board.org/htdocs/' ]]; then
          echo '::error::FTP_SERVER_DIR must be the exact school.my-board.org/htdocs/ folder.'
          exit 1
        fi

    - name: Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: school.my-board.org/htdocs/ # Subdomain folder for school.my-board.org
        protocol: ftps
        port: 21
        # Exclusions apply to uploads AND deletions from the previous sync state.
        # These files belong to the running school, not the source repository.
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.env*
          **/*.sqlite
          **/*.sqlite-*
          **/*.sqlite3
          **/*.sqlite3-*
          **/*.db
          **/*.db-*
          **/*.bak
          **/*.sql.gz
          **/school_erp_mysql*.sql*
          **/migration-manifest*.json
          **/source-manifest*.json
          **/projected-manifest*.json
          **/migration-report*.md
          **/*migration-report*.json
          **/verification-error.json
          **/statements.jsonl
          **/.backups
          **/.backups/**
          **/backups
          **/backups/**
          **/uploads
          **/uploads/**
          config/config.php
          config/local.php
          config/*.local.php
          **/__pycache__/**
          **/*.pyc
          scratch/**
          tests/**
          docs/**
          frontend/**
          tools/**
          package.json
          package-lock.json
          .superpowers/**
          **/*.log
