name: Deploy Website via FTP

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never interrupt an FTP transfer or allow concurrent writes to the same site.
concurrency:
  group: school-ftp-production
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history so git diff works for FTP deploy

    - name: Set up build-time Node (not required by the PHP host)
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Build local frontend assets
      run: |
        npm ci --no-fund
        npm run build
        npm run test:ui
    
    - name: Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: school.my-board.org/htdocs/ # Subdomain folder for school.my-board.org
        # Exclusions apply to uploads AND deletions from the previous sync state.
        # These files belong to the running school, not the source repository.
        dangerous-clean-slate: false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.env*
          **/*.sqlite
          **/*.sqlite-*
          **/*.sqlite3
          **/*.sqlite3-*
          **/*.db
          **/*.db-*
          **/*.bak
          **/.backups
          **/.backups/**
          **/backups
          **/backups/**
          **/uploads
          **/uploads/**
          config/config.php
          config/local.php
          config/*.local.php
          **/__pycache__/**
          **/*.pyc
          scratch/**
          tests/**
          docs/**
          frontend/**
          tools/**
          package.json
          package-lock.json
          .superpowers/**
          **/*.log
